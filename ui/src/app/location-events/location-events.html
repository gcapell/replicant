<button type="button" class="link" (click)="fetch()" [disabled]="loading()">
  {{ loading() ? 'Fetching…' : 'Fetch' }}
</button>

@if (events()?.length) {
  <table>
    <thead>
      <tr>
        <th>Location</th>
        <th>Tier</th>
        <th>Request</th>
        <th>Reward</th>
      </tr>
    </thead>
    <tbody>
      @for (e of events(); track e.designation) {
        <tr>
          <td><a href="#" (click)="$event.preventDefault(); api.loadLocation(e.location)">{{ e.location }}</a></td>
          <td class="num">{{ e.tier }}</td>
          <td>
            @for (o of formatRequest(e); track $index) {
              <div>{{ o }}</div>
            }
          </td>
          <td>{{ formatReward(e.rewards) }}</td>
        </tr>
      }
    </tbody>
  </table>
} @else if (events()) {
  <p>No active location events.</p>
}
