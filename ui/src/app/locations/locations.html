 <button type="button" class="link" (click)="api.locations()">Fetch</button> 

 @if (api.locationList(); as locs) {
    <table>
        <thead>
            <tr>
                <th>loc</th>
                <th>resources</th>
                <th>sites</th>
            </tr>
        </thead>
        <tbody>
            @for (kv of locs.locations |keyvalue; track kv.key){
                @if(kv.value.resources || kv.value.resource_sites){
                    <tr>
                        <td>{{kv.key}}</td>
                        <td>{{kv.value.resources}}</td>
                        <td>{{kv.value.resource_sites}}</td>
                    </tr>
                }
            }
        </tbody>

    </table>

     <details>
        <summary>Raw JSON</summary>
        <pre>{{ locs| json }}</pre>
    </details>
}
