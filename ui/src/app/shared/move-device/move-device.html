<input
    #destination
    type="text"
    placeholder="move to..."
    [attr.list]="listId"
    (input)="value.set(destination.value)"
/>
<datalist [id]="listId">
    @for ( d of destinations() ?? []; track d){
        <option [value]="d"></option>
    }
</datalist>
<button type="button" [disabled]="!valid()" (click)="api.sendDrone(deviceCode(), value())">Send</button>
