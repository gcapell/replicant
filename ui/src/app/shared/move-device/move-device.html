<select #destination>
    <option value="" disabled selected>move to...</option>
    @for ( p of api.replicantScanResult()?.planets; track p.designation){
        <option [value]="p.designation">{{p.designation}}</option>
    }
</select>
<button type="button" (click)="api.sendDrone(deviceCode(), destination.value)">Send</button>
