@if (orphans().length) {
    <select #drones multiple>
    @for (id of orphans(); track id) {
        @let ds = device_by_id().get(id);
        @if (ds != null){
            @let d = ds();
            <option [value]="id">{{ id }} {{d.device_type}}@{{ d.location }}</option>
        }
    }
    </select>
    <button type="button" (click)="adopt.emit(selected(drones))">Adopt</button>
}
