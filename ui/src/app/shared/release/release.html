@if (children()?.length) {
    <select #drones multiple>
    @for (id of children(); track id) {
        @let d = device_by_id().get(id);
        @if (d != null){
            <option [value]="id">{{ id }}@{{d().location}}</option>
        }
    }
    </select>
    <button type="button" (click)="release.emit(selected(drones))">Release</button>
}
